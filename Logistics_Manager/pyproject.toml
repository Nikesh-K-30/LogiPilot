[project]
name = "logipilot"
version = "1.0.0"
description = "LogiPilot AI — LoadLink pooling + RouteWise optimization (Google ADK + MCP)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "google-adk[mcp]>=1.0.0",
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
logipilot-api = "app.api:main"
logipilot-seed = "database.seed:main"
logipilot-mcp = "mcp_servers.logistics_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_servers", "database"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
